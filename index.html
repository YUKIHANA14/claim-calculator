
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>클레임 건수 계산기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f4;
      padding: 40px 15px;
      text-align: center;
    }
    .card {
      background: white;
      max-width: 380px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ddd;
    }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background: #005b4f;
      color: white;
      border: none;
      padding: 14px 35px;
      border-radius: 8px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>클레임 건수 계산기</h2>
    <p>지난달 클레임 건수</p>
    <input type="number" id="last" min="0" value="15">
    <p>이번 달 클레임 건수</p>
    <input type="number" id="current" min="0" value="8">
    <br><br>
    <button onclick="calculate()">계산하기</button>
    <div id="result"></div>
    
<div id="chart" style="margin-top:25px; display:none;">
  <h3>클레임 건수 비교</h3>
  <div style="display:flex;align-items:flex-end;justify-content:center;gap:40px;height:220px;">
    
<div style="text-align:center;">
  <div id="value-last" style="font-weight:bold;">15건</div>
  <div id="bar-last" style="width:65px;background:#91b5ae;margin:0 auto;"></div>
  <p>지난달</p>
</div>
<div style="text-align:center;">
  <div id="value-current" style="font-weight:bold;">8건</div>
  <div id="bar-current" style="width:65px;background:#005b4f;margin:0 auto;"></div>
  <p>이번 달</p>
</div>

  </div>
</div>

  </div>

  <script>

function calculate() {
  const lastInput = document.getElementById("last").value;
  const currentInput = document.getElementById("current").value;

  const last = Number(lastInput);
  const current = Number(currentInput);
  const result = document.getElementById("result");
  const chart = document.getElementById("chart");

  // 입력값 확인
  if (lastInput === "" || currentInput === "" ||
      !Number.isInteger(last) || !Number.isInteger(current) ||
      last < 0 || current < 0) {
    result.innerText = "0 이상의 정수를 입력하세요.";
    chart.style.display = "none";
    return;
  }

  // 클레임 증감 계산
  const difference = current - last;
  const sign = difference > 0 ? "+" : "";

  if (last === 0) {
    result.innerText =
      `전월 대비 ${sign}${difference}건 (증감률 계산 불가)`;
  } else {
    const percent = (difference / last * 100).toFixed(1);

    result.innerText =
      `전월 대비 ${sign}${difference}건 (${sign}${percent}%)`;
  }

  // 막대그래프 표시
  chart.style.display = "block";

  const max = Math.max(last, current, 1);

  const lastHeight = (last / max) * 160;
  const currentHeight = (current / max) * 160;

  document.getElementById("bar-last").style.height =
    lastHeight + "px";

  document.getElementById("bar-current").style.height =
    currentHeight + "px";
}

  </script>
</body>
</html>
